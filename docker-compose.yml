services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radiopilot
      POSTGRES_USER: radiopilot
      POSTGRES_PASSWORD: radiopilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiopilot -d radiopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://radiopilot:radiopilot@postgres:5432/radiopilot
      REDIS_URL: redis://redis:6379/0
      AUDIO_ENGINE: ${AUDIO_ENGINE:-null}
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: 1234
      LIQUIDSOAP_MEDIA_PREFIX: /media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  liquidsoap:
    profiles: ["broadcast"]
    build: ./docker/liquidsoap
    env_file: .env
    depends_on:
      - api
    volumes:
      - media_data:/media:ro

  celery-worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://radiopilot:radiopilot@postgres:5432/radiopilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A celery_app.celery_app worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://radiopilot:radiopilot@postgres:5432/radiopilot
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A celery_app.celery_app beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: ./backend
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A celery_app.celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/state
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  media_data:
